name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Serve a pubblicare la release con l'APK allegato.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Configura JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configura Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Test unitari
        run: ./gradlew testDebugUnitTest --no-daemon

      # La chiave Persoft arriva dai segreti del progetto e vive solo dentro il run.
      #
      # Il `.jks` e' un file binario e in un segreto ci sta in base64. Si scrive nella cartella
      # dell'app, dove il build.gradle.kts lo cerca, e la cartella e' quella di un runner
      # usa-e-getta: finito il run, sparisce con lui. Se il segreto non c'e' - un fork, un
      # clone di prova - non succede niente e la release esce firmata con la chiave di
      # sviluppo, che si installa lo stesso.
      - name: Prepara la firma Persoft
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/persoft-release.jks
            echo "Chiave Persoft in posizione ($(stat -c%s app/persoft-release.jks) byte)."
          else
            echo "Nessun segreto SIGNING_KEYSTORE_BASE64: si firma con la chiave di sviluppo."
          fi

      - name: Compila l'APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Pubblica l'APK come artefatto
        uses: actions/upload-artifact@v4
        with:
          name: luna-ultra-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Gli artefatti delle Actions si scaricano solo da browser desktop e da
      # utenti autenticati: dal telefono non compaiono. La release invece dà un
      # link diretto, che è come si installa un APK in pratica.
      # Anche dall'avvio manuale, non solo dai push. Un run partito da un push puo'
      # incastrarsi prima ancora di ottenere una macchina — succede, e quando succede
      # l'unico modo di ripubblicare l'APK era fare un commit finto. Con l'avvio manuale
      # abilitato si ripubblica lo stesso commit senza sporcare la storia.
      - name: Pubblica l'APK come release scaricabile
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="apk-${BRANCH//\//-}"
          {
            echo "Build automatica del commit ${COMMIT}. Scarica l'APK qui sotto."
            echo
            echo "Sul telefono va consentita l'installazione da origini sconosciute: l'app non passa"
            echo "dal Play Store."
            echo
            echo "Gli aggiornamenti si installano sopra la versione precedente, senza disinstallare."
            echo "L'app controlla e scarica questa release all'avvio."
            echo
            echo "Se compare «il pacchetto e' in conflitto con un pacchetto esistente» vuol dire che"
            echo "l'app installata e' firmata con un'altra chiave: disinstalla una volta sola e da li"
            echo "in poi gli aggiornamenti tornano a installarsi sopra. Succede una volta, al"
            echo "passaggio dalla firma di sviluppo a quella Persoft."
          } > release-notes.md
          # Il nome dell'allegato porta dentro il commit, e non e' un vezzo. Gli allegati
          # si scaricano da releases/download/<tag>/<nome>, un indirizzo che la rete di
          # distribuzione di GitHub tiene in cache; il tag qui si riusa sempre, e finche' si
          # riusava anche il nome quell'indirizzo restava identico da una build all'altra.
          # L'app leggeva da api.github.com — che in cache non ci va — il commit e l'impronta
          # nuovi, e si vedeva consegnare i byte della build precedente: impronta diversa,
          # aggiornamento fermo. Con il commit nel nome l'indirizzo e' nuovo ogni volta e in
          # cache non ci puo' essere per definizione.
          APK="luna-${COMMIT:0:12}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            --target "$COMMIT" \
            --title "APK - $BRANCH" \
            --notes-file release-notes.md \
            --prerelease \
            "$APK"

name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Serve a pubblicare la release con l'APK allegato.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Configura JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configura Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Test unitari
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Compila APK di debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Pubblica l'APK come artefatto
        uses: actions/upload-artifact@v4
        with:
          name: luna-timelapse-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Gli artefatti delle Actions si scaricano solo da browser desktop e da
      # utenti autenticati: dal telefono non compaiono. La release invece dà un
      # link diretto, che è come si installa un APK in pratica.
      # Anche dall'avvio manuale, non solo dai push. Un run partito da un push puo'
      # incastrarsi prima ancora di ottenere una macchina — succede, e quando succede
      # l'unico modo di ripubblicare l'APK era fare un commit finto. Con l'avvio manuale
      # abilitato si ripubblica lo stesso commit senza sporcare la storia.
      - name: Pubblica l'APK come release scaricabile
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="apk-${BRANCH//\//-}"
          {
            echo "Build automatica del commit ${COMMIT}. Scarica l'APK qui sotto."
            echo
            echo "E' una build di debug: sul telefono va consentita l'installazione da origini sconosciute."
            echo
            echo "Gli aggiornamenti si installano sopra la versione precedente, senza disinstallare."
            echo "Dalla build che include l'updater, l'app controlla e scarica questa release all'avvio."
            echo "Se compare «il pacchetto e' in conflitto con un pacchetto esistente» vieni da una"
            echo "build vecchia, firmata con una chiave casuale: disinstalla l'app una volta sola e"
            echo "da li in poi gli aggiornamenti si installano sopra."
          } > release-notes.md
          # Il nome dell'allegato porta dentro il commit, e non e' un vezzo. Gli allegati
          # si scaricano da releases/download/<tag>/<nome>, un indirizzo che la rete di
          # distribuzione di GitHub tiene in cache; il tag qui si riusa sempre, e finche' si
          # riusava anche il nome quell'indirizzo restava identico da una build all'altra.
          # L'app leggeva da api.github.com — che in cache non ci va — il commit e l'impronta
          # nuovi, e si vedeva consegnare i byte della build precedente: impronta diversa,
          # aggiornamento fermo. Con il commit nel nome l'indirizzo e' nuovo ogni volta e in
          # cache non ci puo' essere per definizione.
          APK="luna-${COMMIT:0:12}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            --target "$COMMIT" \
            --title "APK di debug - $BRANCH" \
            --notes-file release-notes.md \
            --prerelease \
            "$APK"

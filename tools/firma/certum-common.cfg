# Configurazione SunPKCS11 per il token Certum (cryptoCertum 3.7).
#
# La chiave di firma Persoft sta nel "common profile", non nel "profil bezpieczny":
# il profilo sicuro ha il PIN bloccato e comunque non serve. La libreria
# crypto3PKCS.dll espone solo il common profile, quindi slotListIndex e' sempre 0
# e non c'e' modo di sbagliare slot.
#
# Nessun segreto qui dentro: il PIN viaggia a parte, per variabile d'ambiente.
name = Certum
library = C:/Windows/System32/crypto3PKCS.dll
slotListIndex = 0
